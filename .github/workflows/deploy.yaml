name: Deploy AssessFirst

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-assessfirst-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.ASSESSFIRST_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H "${{ secrets.ASSESSFIRST_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.ASSESSFIRST_EC2_USER }}@${{ secrets.ASSESSFIRST_EC2_HOST }} << EOF
          set -e

          cd /home/ubuntu/assessfirst_backend

          git fetch origin
          git reset --hard origin/main
          git clean -fd

          docker network create assessfirst-network || true

          docker compose \
            -p assessfirst \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            down || true

          docker rm -f assessfirst-backend assessfirst-postgres 2>/dev/null || true

          docker compose \
            -p assessfirst \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            up -d --build --remove-orphans postgres backend

          docker image prune -f
          EOF